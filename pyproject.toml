[project]
name = "mentor-generator"
version = "0.42.0"
description = "Agentic mentor file generator — deterministic LLM-powered curriculum and persona creation"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pyyaml>=6.0",
    "google-generativeai>=0.8.0",
]

[project.scripts]
mentor-generator = "agent.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
